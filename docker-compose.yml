services:
  claude-proxy:
    build: .
    image: claude-free-proxy:latest
    container_name: claude-free-proxy
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - ./config.json:/app/config.json
      - ./accounts.json:/app/accounts.json
